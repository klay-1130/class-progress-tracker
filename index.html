<title>수업진도표</title>
<style>
  :root {
    --bg: #edece4;
    --surface: #ffffff;
    --surface-alt: #f5f4ee;
    --ink: #23261f;
    --ink-soft: #63685b;
    --line: #d9d6c8;
    --accent: #3c6e57;
    --accent-strong: #2b5343;
    --accent-soft: #dce8df;
    --danger: #a8432e;
    --danger-soft: #f1dfd8;
    --radius: 10px;
    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", "Consolas", monospace;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c16;
      --surface: #22251d;
      --surface-alt: #262920;
      --ink: #ece9dd;
      --ink-soft: #a7ab9b;
      --line: #3a3d31;
      --accent: #74ac8e;
      --accent-strong: #8fc0a5;
      --accent-soft: #2b3b31;
      --danger: #de8770;
      --danger-soft: #3a241f;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1c16;
    --surface: #22251d;
    --surface-alt: #262920;
    --ink: #ece9dd;
    --ink-soft: #a7ab9b;
    --line: #3a3d31;
    --accent: #74ac8e;
    --accent-strong: #8fc0a5;
    --accent-soft: #2b3b31;
    --danger: #de8770;
    --danger-soft: #3a241f;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
  :root[data-theme="light"] {
    --bg: #edece4;
    --surface: #ffffff;
    --surface-alt: #f5f4ee;
    --ink: #23261f;
    --ink-soft: #63685b;
    --line: #d9d6c8;
    --accent: #3c6e57;
    --accent-strong: #2b5343;
    --accent-soft: #dce8df;
    --danger: #a8432e;
    --danger-soft: #f1dfd8;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 40px 20px 80px;
    line-height: 1.5;
  }

  .page {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---- Subject tabs ---- */
  .subject-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tab-color, var(--ink-soft)); flex: none; }
  .tab:hover { border-color: var(--tab-color, var(--accent)); color: var(--ink); }
  .tab.active {
    background: color-mix(in oklab, var(--tab-color, var(--accent)) 30%, var(--surface));
    border-color: var(--tab-color, var(--accent));
    color: var(--ink);
  }
  .tab.active .tab-dot { background: var(--tab-color, var(--accent)); }
  .tab-close {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 12px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    line-height: 1;
    padding: 0;
  }
  .tab-close:hover { background: var(--danger-soft); color: var(--danger); }
  .tab-add {
    display: inline-flex;
    align-items: center;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tab-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---- Header ---- */
  .header-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  .subject-input {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 2px 0;
    width: 100%;
  }
  .subject-input:hover { border-bottom-color: var(--line); }
  .subject-input:focus-visible {
    outline: none;
    border-bottom-color: var(--accent);
  }

  .meta-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px 24px;
  }

  .meta-field { display: flex; flex-direction: column; gap: 4px; }

  .meta-field label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-family: var(--font-mono);
  }

  .meta-field input {
    font-family: var(--font-ui);
    font-size: 14.5px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 4px 2px;
  }
  .meta-field input:focus-visible {
    outline: none;
    border-bottom: 1.5px solid var(--accent);
  }

  /* ---- Progress strip ---- */
  .progress-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .progress-stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 92px;
  }
  .progress-stat .num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
  }
  .progress-stat .label {
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .progress-bar-wrap { flex: 1 1 220px; min-width: 180px; }
  .progress-bar-track {
    height: 8px;
    border-radius: 5px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 5px 0 0 5px;
    transition: width 0.35s ease;
    width: 0%;
  }
  @media (prefers-reduced-motion: reduce) {
    .progress-bar-fill { transition: none; }
  }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  button {
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 16px;
    cursor: pointer;
  }
  button:hover { background: var(--surface-alt); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  button.ghost-danger { color: var(--danger); border-color: var(--line); }
  button.ghost-danger:hover { background: var(--danger-soft); border-color: var(--danger); }

  .view-toggle {
    display: inline-flex;
    padding: 3px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 9px;
    gap: 2px;
  }
  .view-toggle button {
    border: none;
    background: transparent;
    padding: 7px 14px;
    border-radius: 6px;
    color: var(--ink-soft);
  }
  .view-toggle button:hover { background: transparent; color: var(--ink); }
  .view-toggle button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  #combinedToggleBtn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-strong);
  }

  /* ---- Calendar ---- */
  .calendar-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 18px 20px 14px;
  }
  .month-nav .month-label {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 600;
    min-width: 130px;
    text-align: center;
  }
  .month-nav button {
    padding: 6px 10px;
    line-height: 1;
  }
  .month-nav .today-btn { margin-left: 8px; }

  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--line);
    background: var(--surface-alt);
  }
  .weekday-row span {
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
  }
  .weekday-row span:first-child { color: var(--danger); }
  .weekday-row span:last-child { color: var(--accent); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day-cell {
    position: relative;
    min-height: 96px;
    padding: 6px 6px 8px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .day-cell:nth-child(7n) { border-right: none; }
  .day-cell.outside { background: var(--surface-alt); }
  .day-cell.outside .day-num { color: var(--ink-soft); opacity: 0.55; }

  .day-num-row { display: flex; align-items: center; justify-content: space-between; }
  .day-num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .day-cell.is-today .day-num {
    color: #fff;
    background: var(--accent);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .day-add {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 13px;
    width: 18px;
    height: 18px;
    line-height: 1;
    border-radius: 4px;
    padding: 0;
    opacity: 0.55;
  }
  .day-add:hover { opacity: 1; background: var(--accent-soft); color: var(--accent-strong); }

  .chip-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    max-height: 84px;
  }
  .chip {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 11.5px;
    padding: 4px 6px;
    border-radius: 5px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--cal-color, var(--line));
    background: var(--surface-alt);
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--cal-color, var(--accent)); }
  .chip.is-done {
    background: color-mix(in oklab, var(--cal-color, var(--accent)) 22%, var(--surface));
    border-color: var(--cal-color, var(--accent));
    color: var(--ink);
  }

  .unscheduled-note {
    padding: 10px 20px 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .unscheduled-note button {
    padding: 2px 8px;
    font-size: 12px;
    margin-left: 6px;
  }

  @keyframes rowFlash {
    0% { background: var(--accent-soft); }
    100% { background: transparent; }
  }
  tr.row-flash td input,
  tr.row-flash td { background: transparent; }
  tr.row-flash { animation: rowFlash 1.6s ease; }
  @media (prefers-reduced-motion: reduce) {
    tr.row-flash { animation: none; background: var(--accent-soft); }
  }

  /* ---- Table ---- */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 960px;
  }

  thead th {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: left;
    color: var(--ink-soft);
    background: var(--surface-alt);
    border-bottom: 1px solid var(--line);
    padding: 12px 14px;
    position: sticky;
    top: 0;
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--surface-alt); }
  tbody tr.is-done { background: var(--accent-soft); }

  td { padding: 6px 8px; vertical-align: middle; }

  .col-num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--ink-soft);
    width: 44px;
  }

  td input[type="text"], td input[type="date"] {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 13.5px;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 7px 8px;
  }
  td input[type="date"] {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  td input:hover { border-color: var(--line); }
  td input:focus-visible {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }

  .col-subject {
    min-width: 110px;
    white-space: nowrap;
    border-left: 3px solid var(--link-color, transparent);
  }
  .subject-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: transparent;
    padding: 0;
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .subject-link:hover { text-decoration: underline; }
  .subject-link .tab-dot { background: var(--link-color, var(--ink-soft)); }

  .col-date { width: 140px; }
  .col-class { width: 90px; }
  .col-unit { min-width: 150px; }
  .col-content { min-width: 220px; }
  .col-hw { min-width: 150px; }
  .col-note { min-width: 140px; }

  .col-done { width: 60px; text-align: center; }
  .check {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .col-del { text-align: center; white-space: nowrap; }
  .row-actions { display: inline-flex; align-items: center; gap: 2px; }
  .row-del {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 15px;
    padding: 4px 8px;
    border-radius: 5px;
  }
  .row-del:hover { color: var(--danger); background: var(--danger-soft); }

  .row-move {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 11px;
    padding: 4px 6px;
    border-radius: 5px;
    line-height: 1;
  }
  .row-move:hover:not(:disabled) { background: var(--surface-alt); color: var(--ink); }
  .row-move:disabled { opacity: 0.25; cursor: default; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 32px;
    border-top: 1px solid var(--line);
    background: var(--surface-alt);
  }

  .save-status {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  /* ---- Timetable ---- */
  .timetable-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .tt-hint {
    padding: 14px 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    text-align: center;
  }

  .tt-table { min-width: 640px; }

  .tt-cell-inner { display: flex; flex-direction: column; gap: 2px; }
  .tt-cell-top { display: flex; align-items: center; gap: 2px; }

  .tt-cell.is-filled {
    background: color-mix(in oklab, var(--cell-color, var(--accent)) 22%, var(--surface));
    border-left: 3px solid var(--cell-color, var(--accent));
  }

  .tt-select {
    flex: 1;
    min-width: 0;
    font-family: var(--font-ui);
    font-size: 13.5px;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 7px 8px;
    cursor: pointer;
  }
  .tt-select:hover { border-color: var(--line); }
  .tt-select:focus-visible {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }

  .tt-class-input {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 4px 8px;
  }
  .tt-class-input:hover { border-color: var(--line); }
  .tt-class-input:focus-visible {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
    color: var(--ink);
  }

  .tt-jump {
    flex: none;
    border: none;
    background: transparent;
    color: var(--accent-strong);
    font-weight: 700;
    font-size: 13px;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    padding: 0;
    cursor: pointer;
  }
  .tt-jump:hover { background: var(--accent-soft); }

  .tt-period-label {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 7px 6px;
    text-align: center;
  }
  .tt-period-label:hover { border-color: var(--line); }
  .tt-period-label:focus-visible {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }

  /* ---- Print ---- */
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .row-del, .col-del, .footer-row, .day-add, .unscheduled-note,
    .month-nav button, .subject-tabs, .tt-jump, .tt-hint { display: none !important; }
    .header-card, .progress-card, .table-card, .calendar-card, .timetable-card {
      border: none;
      box-shadow: none;
    }
    thead th { position: static; background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tbody tr.is-done { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .day-cell.is-today .day-num { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .chip.is-done { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .tt-cell.is-filled { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<div class="page">
  <nav class="subject-tabs" id="subjectTabs" aria-label="과목 목록"></nav>

  <header class="header-card" id="headerCard">
    <div class="eyebrow">CLASS PROGRESS LOG</div>
    <input class="subject-input" id="subjectInput" placeholder="과목명을 입력하세요 (예: 중2 수학)" aria-label="과목명" />
    <div class="meta-row">
      <div class="meta-field">
        <label for="teacherInput">담당 교사</label>
        <input type="text" id="teacherInput" placeholder="예: 김민준" />
      </div>
      <div class="meta-field">
        <label for="semesterInput">학기 / 기간</label>
        <input type="text" id="semesterInput" placeholder="예: 2026학년도 2학기" />
      </div>
      <div class="meta-field">
        <label for="bookInput">교재 / 커리큘럼</label>
        <input type="text" id="bookInput" placeholder="예: 개념원리 수학2" />
      </div>
    </div>
  </header>

  <section class="progress-card" id="progressCard" aria-label="진도 현황 요약">
    <div class="progress-stat">
      <span class="num" id="statTotal">0</span>
      <span class="label">총 회차</span>
    </div>
    <div class="progress-stat">
      <span class="num" id="statDone">0</span>
      <span class="label">완료 회차</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="progress-stat">
      <span class="num" id="statPercent">0%</span>
      <span class="label">진도율</span>
    </div>
  </section>

  <div class="toolbar">
    <div class="view-toggle" role="group" aria-label="보기 방식">
      <button id="viewTableBtn" type="button" aria-pressed="true">표 보기</button>
      <button id="viewCalendarBtn" type="button" aria-pressed="false">달력 보기</button>
      <button id="viewTimetableBtn" type="button" aria-pressed="false">시간표 보기</button>
    </div>
    <div class="toolbar-actions">
      <button id="combinedToggleBtn" type="button" aria-pressed="false">전체 과목 통합 보기</button>
      <button id="addRowBtn" class="primary" type="button">+ 회차 추가</button>
      <button id="importExcelBtn" class="primary" type="button" hidden>엑셀 불러오기</button>
      <input type="file" id="excelFileInput" accept=".xlsx,.csv" hidden />
      <button id="addPeriodBtn" type="button" hidden>+ 교시 추가</button>
      <button id="printBtn" type="button">인쇄</button>
      <button id="resetBtn" class="ghost-danger" type="button">이 과목 초기화</button>
      <button id="resetTimetableBtn" class="ghost-danger" type="button" hidden>시간표 초기화</button>
    </div>
  </div>

  <div class="calendar-card" id="calendarCard" hidden>
    <div class="month-nav">
      <button id="prevMonthBtn" type="button" aria-label="이전 달">‹</button>
      <span class="month-label" id="monthLabel">2026년 1월</span>
      <button id="nextMonthBtn" type="button" aria-label="다음 달">›</button>
      <button id="todayBtn" class="today-btn" type="button">오늘</button>
    </div>
    <div class="weekday-row">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="unscheduled-note" id="unscheduledNote" hidden></div>
  </div>

  <div class="timetable-card" id="timetableCard" hidden>
    <div class="tt-hint">셀에서 과목을 선택하고 반(학반)도 함께 입력해 시간표를 채우세요. 엑셀(xlsx/csv)을 불러오면 첫 행(요일)·첫 열(교시) 구조를 자동으로 인식하고, 표에 없는 과목명은 새 탭으로 추가할 수 있어요.</div>
    <div class="table-scroll">
      <table class="tt-table">
        <thead>
          <tr id="timetableHead"></tr>
        </thead>
        <tbody id="timetableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="table-card" id="tableCard">
    <div class="table-scroll">
      <table>
        <thead>
          <tr id="tableHeadRow"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" hidden>아직 회차가 없습니다. 위의 “+ 회차 추가” 버튼으로 시작하세요.</div>
    <div class="footer-row">
      <span class="save-status" id="saveStatus">저장 대기 중</span>
      <span class="save-status">이 브라우저에 자동 저장됩니다</span>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "classProgressTracker_v2";
  const LEGACY_KEY = "classProgressTracker_v1";

  function makeId() {
    return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
  }

  function makeRow(overrides) {
    return Object.assign({ date: "", classGroup: "", unit: "", content: "", hw: "", note: "", done: false }, overrides || {});
  }

  function makeSubject(name) {
    return {
      id: makeId(),
      name: name || "",
      teacher: "",
      semester: "",
      book: "",
      rows: [makeRow(), makeRow(), makeRow()],
    };
  }

  function defaultTimetable() {
    return {
      days: ["월", "화", "수", "목", "금"],
      periods: Array.from({ length: 7 }, (_, i) => ({ label: `${i + 1}교시`, cells: {} })),
    };
  }

  function freshState() {
    const subject = makeSubject("과목 1");
    subject.colorIndex = 0;
    return { subjects: [subject], activeId: subject.id, timetable: defaultTimetable(), nextColorIndex: 1 };
  }

  function migrateLegacy() {
    try {
      const raw = localStorage.getItem(LEGACY_KEY);
      if (!raw) return null;
      const old = JSON.parse(raw);
      if (!old.meta || !Array.isArray(old.rows)) return null;
      const subject = {
        id: makeId(),
        name: old.meta.subject || "과목 1",
        teacher: old.meta.teacher || "",
        semester: old.meta.semester || "",
        book: old.meta.book || "",
        rows: old.rows.map(r => makeRow({ ...r, classGroup: old.meta.classGroup || "" })),
        colorIndex: 0,
      };
      return { subjects: [subject], activeId: subject.id, timetable: defaultTimetable(), nextColorIndex: 1 };
    } catch (e) {
      return null;
    }
  }

  function loadState() {
    let result = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.subjects) && parsed.subjects.length && parsed.activeId) result = parsed;
      }
    } catch (e) { /* fall through */ }
    if (!result) result = migrateLegacy();
    if (!result) result = freshState();
    if (!result.timetable) result.timetable = defaultTimetable();
    if (typeof result.nextColorIndex !== "number") result.nextColorIndex = 0;
    result.subjects.forEach(s => {
      if (typeof s.colorIndex !== "number") {
        s.colorIndex = result.nextColorIndex;
        result.nextColorIndex = (result.nextColorIndex + 1) % 8;
      }
    });
    return result;
  }

  function nextColor() {
    const i = state.nextColorIndex;
    state.nextColorIndex = (state.nextColorIndex + 1) % 8;
    return i;
  }

  function subjectColorVar(subject) {
    return `var(--series-${(((subject && subject.colorIndex) || 0) % 8) + 1})`;
  }

  let state = loadState();
  let saveTimer = null;
  const today = new Date();
  let currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  let currentView = "table";
  let combinedView = false;

  const el = {
    tabs: document.getElementById("subjectTabs"),
    subject: document.getElementById("subjectInput"),
    teacher: document.getElementById("teacherInput"),
    semester: document.getElementById("semesterInput"),
    book: document.getElementById("bookInput"),
    tbody: document.getElementById("tableBody"),
    tableHeadRow: document.getElementById("tableHeadRow"),
    combinedToggleBtn: document.getElementById("combinedToggleBtn"),
    empty: document.getElementById("emptyState"),
    statTotal: document.getElementById("statTotal"),
    statDone: document.getElementById("statDone"),
    statPercent: document.getElementById("statPercent"),
    fill: document.getElementById("progressFill"),
    saveStatus: document.getElementById("saveStatus"),
    headerCard: document.getElementById("headerCard"),
    progressCard: document.getElementById("progressCard"),
    tableCard: document.getElementById("tableCard"),
    calendarCard: document.getElementById("calendarCard"),
    timetableCard: document.getElementById("timetableCard"),
    viewTableBtn: document.getElementById("viewTableBtn"),
    viewCalendarBtn: document.getElementById("viewCalendarBtn"),
    viewTimetableBtn: document.getElementById("viewTimetableBtn"),
    monthLabel: document.getElementById("monthLabel"),
    calendarGrid: document.getElementById("calendarGrid"),
    unscheduledNote: document.getElementById("unscheduledNote"),
    prevMonthBtn: document.getElementById("prevMonthBtn"),
    nextMonthBtn: document.getElementById("nextMonthBtn"),
    todayBtn: document.getElementById("todayBtn"),
    addRowBtn: document.getElementById("addRowBtn"),
    resetBtn: document.getElementById("resetBtn"),
    resetTimetableBtn: document.getElementById("resetTimetableBtn"),
    importExcelBtn: document.getElementById("importExcelBtn"),
    excelFileInput: document.getElementById("excelFileInput"),
    addPeriodBtn: document.getElementById("addPeriodBtn"),
    timetableHead: document.getElementById("timetableHead"),
    timetableBody: document.getElementById("timetableBody"),
  };

  function activeSubject() {
    return state.subjects.find(s => s.id === state.activeId) || state.subjects[0];
  }

  function escapeAttr(str) {
    return String(str ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function scheduleSave() {
    el.saveStatus.textContent = "저장 중…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      el.saveStatus.textContent = `${hh}:${mm}에 저장됨`;
    }, 350);
  }

  function renderTabs() {
    el.tabs.innerHTML = "";
    state.subjects.forEach(subject => {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab" + (subject.id === state.activeId ? " active" : "");
      tab.setAttribute("aria-pressed", String(subject.id === state.activeId));
      tab.style.setProperty("--tab-color", subjectColorVar(subject));

      const dot = document.createElement("span");
      dot.className = "tab-dot";
      tab.appendChild(dot);

      const label = document.createElement("span");
      label.textContent = subject.name || "(제목 없는 과목)";
      tab.appendChild(label);

      if (state.subjects.length > 1) {
        const close = document.createElement("button");
        close.type = "button";
        close.className = "tab-close";
        close.textContent = "✕";
        close.setAttribute("aria-label", `${subject.name || "이 과목"} 삭제`);
        close.addEventListener("click", (evt) => {
          evt.stopPropagation();
          if (confirm(`"${subject.name || "제목 없는 과목"}" 과목을 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) {
            const idx = state.subjects.findIndex(s => s.id === subject.id);
            state.subjects.splice(idx, 1);
            if (state.activeId === subject.id) {
              state.activeId = state.subjects[Math.max(0, idx - 1)].id;
            }
            renderAll();
            scheduleSave();
          }
        });
        tab.appendChild(close);
      }

      tab.addEventListener("click", () => {
        if (state.activeId === subject.id) return;
        state.activeId = subject.id;
        renderAll();
        scheduleSave();
      });

      el.tabs.appendChild(tab);
    });

    const addTab = document.createElement("button");
    addTab.type = "button";
    addTab.className = "tab-add";
    addTab.textContent = "+ 과목 추가";
    addTab.addEventListener("click", () => {
      const subject = makeSubject(`과목 ${state.subjects.length + 1}`);
      subject.colorIndex = nextColor();
      state.subjects.push(subject);
      state.activeId = subject.id;
      renderAll();
      scheduleSave();
      el.subject.focus();
      el.subject.select();
    });
    el.tabs.appendChild(addTab);
  }

  function fillHeaderInputs() {
    const subject = activeSubject();
    el.subject.value = subject.name;
    el.teacher.value = subject.teacher;
    el.semester.value = subject.semester;
    el.book.value = subject.book;
  }

  function renderStats() {
    const rows = combinedView ? state.subjects.flatMap(s => s.rows) : activeSubject().rows;
    const total = rows.length;
    const done = rows.filter(r => r.done).length;
    const percent = total ? Math.round((done / total) * 100) : 0;
    el.statTotal.textContent = total;
    el.statDone.textContent = done;
    el.statPercent.textContent = percent + "%";
    el.fill.style.width = percent + "%";
  }

  function renderTableHead() {
    el.tableHeadRow.innerHTML =
      (combinedView ? '<th class="col-subject">과목</th>' : "") +
      '<th class="col-num">회차</th>' +
      '<th class="col-date">날짜</th>' +
      '<th class="col-class">반</th>' +
      '<th class="col-unit">단원 / 주제</th>' +
      '<th class="col-content">학습 내용</th>' +
      '<th class="col-hw">과제</th>' +
      '<th class="col-note">비고</th>' +
      '<th class="col-done">완료</th>' +
      '<th class="col-del"></th>';
  }

  function bindRowInputs(tr, row, subject, idx) {
    const [dateInput, classInput, unitInput, contentInput, hwInput, noteInput] = tr.querySelectorAll('input[type="text"], input[type="date"]');
    dateInput.addEventListener("input", () => { row.date = dateInput.value; scheduleSave(); });
    classInput.addEventListener("input", () => { row.classGroup = classInput.value; scheduleSave(); });
    unitInput.addEventListener("input", () => { row.unit = unitInput.value; scheduleSave(); });
    contentInput.addEventListener("input", () => { row.content = contentInput.value; scheduleSave(); });
    hwInput.addEventListener("input", () => { row.hw = hwInput.value; scheduleSave(); });
    noteInput.addEventListener("input", () => { row.note = noteInput.value; scheduleSave(); });

    const checkbox = tr.querySelector(".check");
    checkbox.addEventListener("change", () => {
      row.done = checkbox.checked;
      tr.classList.toggle("is-done", row.done);
      renderStats();
      scheduleSave();
    });

    tr.querySelector(".row-del").addEventListener("click", () => {
      subject.rows.splice(idx, 1);
      renderRows();
      renderStats();
      scheduleSave();
    });
  }

  function renderRows() {
    renderTableHead();
    if (combinedView) return renderCombinedRows();

    const subject = activeSubject();
    const rows = subject.rows;
    el.tbody.innerHTML = "";
    el.empty.hidden = rows.length > 0;

    rows.forEach((row, idx) => {
      const tr = document.createElement("tr");
      if (row.done) tr.classList.add("is-done");
      tr.dataset.subjectId = subject.id;
      tr.dataset.rowIdx = String(idx);

      tr.innerHTML = `
        <td class="col-num">${idx + 1}</td>
        <td class="col-date"><input type="date" value="${row.date}" aria-label="${idx + 1}회차 날짜" /></td>
        <td class="col-class"><input type="text" value="${escapeAttr(row.classGroup)}" placeholder="반" aria-label="${idx + 1}회차 반" /></td>
        <td class="col-unit"><input type="text" value="${escapeAttr(row.unit)}" placeholder="단원명" aria-label="${idx + 1}회차 단원" /></td>
        <td class="col-content"><input type="text" value="${escapeAttr(row.content)}" placeholder="학습 내용" aria-label="${idx + 1}회차 학습내용" /></td>
        <td class="col-hw"><input type="text" value="${escapeAttr(row.hw)}" placeholder="과제" aria-label="${idx + 1}회차 과제" /></td>
        <td class="col-note"><input type="text" value="${escapeAttr(row.note)}" placeholder="비고" aria-label="${idx + 1}회차 비고" /></td>
        <td class="col-done"><input type="checkbox" class="check" ${row.done ? "checked" : ""} aria-label="${idx + 1}회차 완료 여부" /></td>
        <td class="col-del">
          <div class="row-actions">
            <button type="button" class="row-move" data-dir="up" title="위로 이동" aria-label="${idx + 1}회차 위로 이동">▲</button>
            <button type="button" class="row-move" data-dir="down" title="아래로 이동" aria-label="${idx + 1}회차 아래로 이동">▼</button>
            <button type="button" class="row-del" title="이 회차 삭제" aria-label="${idx + 1}회차 삭제">✕</button>
          </div>
        </td>
      `;

      bindRowInputs(tr, row, subject, idx);

      const upBtn = tr.querySelector('.row-move[data-dir="up"]');
      const downBtn = tr.querySelector('.row-move[data-dir="down"]');
      upBtn.disabled = idx === 0;
      downBtn.disabled = idx === rows.length - 1;
      upBtn.addEventListener("click", () => {
        if (idx === 0) return;
        [rows[idx - 1], rows[idx]] = [rows[idx], rows[idx - 1]];
        renderRows();
        scheduleSave();
      });
      downBtn.addEventListener("click", () => {
        if (idx === rows.length - 1) return;
        [rows[idx], rows[idx + 1]] = [rows[idx + 1], rows[idx]];
        renderRows();
        scheduleSave();
      });

      el.tbody.appendChild(tr);
    });
  }

  function renderCombinedRows() {
    el.tbody.innerHTML = "";
    const entries = [];
    state.subjects.forEach(subject => {
      subject.rows.forEach((row, idx) => entries.push({ subject, row, idx }));
    });
    entries.sort((a, b) => {
      if (a.row.date && b.row.date) return a.row.date < b.row.date ? -1 : a.row.date > b.row.date ? 1 : 0;
      if (a.row.date) return -1;
      if (b.row.date) return 1;
      return 0;
    });
    el.empty.hidden = entries.length > 0;

    entries.forEach(({ subject, row, idx }) => {
      const tr = document.createElement("tr");
      if (row.done) tr.classList.add("is-done");
      tr.dataset.subjectId = subject.id;
      tr.dataset.rowIdx = String(idx);

      const subjectName = subject.name || "(제목 없는 과목)";
      tr.innerHTML = `
        <td class="col-subject"><button type="button" class="subject-link"><span class="tab-dot"></span>${escapeAttr(subjectName)}</button></td>
        <td class="col-num">${idx + 1}</td>
        <td class="col-date"><input type="date" value="${row.date}" aria-label="${subjectName} ${idx + 1}회차 날짜" /></td>
        <td class="col-class"><input type="text" value="${escapeAttr(row.classGroup)}" placeholder="반" aria-label="${subjectName} ${idx + 1}회차 반" /></td>
        <td class="col-unit"><input type="text" value="${escapeAttr(row.unit)}" placeholder="단원명" aria-label="${subjectName} ${idx + 1}회차 단원" /></td>
        <td class="col-content"><input type="text" value="${escapeAttr(row.content)}" placeholder="학습 내용" aria-label="${subjectName} ${idx + 1}회차 학습내용" /></td>
        <td class="col-hw"><input type="text" value="${escapeAttr(row.hw)}" placeholder="과제" aria-label="${subjectName} ${idx + 1}회차 과제" /></td>
        <td class="col-note"><input type="text" value="${escapeAttr(row.note)}" placeholder="비고" aria-label="${subjectName} ${idx + 1}회차 비고" /></td>
        <td class="col-done"><input type="checkbox" class="check" ${row.done ? "checked" : ""} aria-label="${subjectName} ${idx + 1}회차 완료 여부" /></td>
        <td class="col-del"><button type="button" class="row-del" title="이 회차 삭제" aria-label="${subjectName} ${idx + 1}회차 삭제">✕</button></td>
      `;

      tr.querySelector(".col-subject").style.setProperty("--link-color", subjectColorVar(subject));

      tr.querySelector(".subject-link").addEventListener("click", () => {
        state.activeId = subject.id;
        combinedView = false;
        updateCombinedToggle();
        renderAll();
      });

      bindRowInputs(tr, row, subject, idx);
      el.tbody.appendChild(tr);
    });
  }

  function updateCombinedToggle() {
    el.combinedToggleBtn.setAttribute("aria-pressed", String(combinedView));
    el.combinedToggleBtn.textContent = combinedView ? "과목별로 보기" : "전체 과목 통합 보기";
  }

  function addRow(dateStr) {
    const rows = activeSubject().rows;
    rows.push(makeRow({ date: dateStr || "" }));
    const newIdx = rows.length - 1;
    renderRows();
    renderStats();
    scheduleSave();
    return newIdx;
  }

  function focusRowInTable(subjectId, idx, focusUnit) {
    switchView("table");
    renderRows();
    const tr = el.tbody.querySelector(`tr[data-subject-id="${subjectId}"][data-row-idx="${idx}"]`);
    if (!tr) return;
    tr.scrollIntoView({ block: "center", behavior: "smooth" });
    tr.classList.remove("row-flash");
    void tr.offsetWidth;
    tr.classList.add("row-flash");
    if (focusUnit) {
      const unitInput = tr.querySelector(".col-unit input");
      if (unitInput) unitInput.focus();
    }
  }

  function switchView(view) {
    currentView = view;
    const isTable = view === "table";
    const isCalendar = view === "calendar";
    const isTimetable = view === "timetable";
    el.tableCard.hidden = !isTable;
    el.calendarCard.hidden = !isCalendar;
    el.timetableCard.hidden = !isTimetable;
    el.headerCard.hidden = isTimetable;
    el.progressCard.hidden = isTimetable;
    el.viewTableBtn.setAttribute("aria-pressed", String(isTable));
    el.viewCalendarBtn.setAttribute("aria-pressed", String(isCalendar));
    el.viewTimetableBtn.setAttribute("aria-pressed", String(isTimetable));
    el.addRowBtn.hidden = isTimetable;
    el.resetBtn.hidden = isTimetable;
    el.combinedToggleBtn.hidden = !isTable;
    el.importExcelBtn.hidden = !isTimetable;
    el.addPeriodBtn.hidden = !isTimetable;
    el.resetTimetableBtn.hidden = !isTimetable;
    if (isCalendar) renderCalendar();
    if (isTimetable) renderTimetable();
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function toDateStr(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }

  function renderCalendar() {
    const subject = activeSubject();
    const rows = subject.rows;
    el.calendarGrid.style.setProperty("--cal-color", subjectColorVar(subject));
    const year = currentMonth.getFullYear();
    const month = currentMonth.getMonth();
    el.monthLabel.textContent = `${year}년 ${month + 1}월`;

    const byDate = {};
    rows.forEach((row, idx) => {
      if (!row.date) return;
      (byDate[row.date] = byDate[row.date] || []).push({ row, idx });
    });

    const firstOfMonth = new Date(year, month, 1);
    const startOffset = firstOfMonth.getDay();
    const gridStart = new Date(year, month, 1 - startOffset);
    const todayStr = toDateStr(today.getFullYear(), today.getMonth(), today.getDate());

    el.calendarGrid.innerHTML = "";
    for (let i = 0; i < 42; i++) {
      const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const dateStr = toDateStr(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
      const isOutside = cellDate.getMonth() !== month;
      const isToday = dateStr === todayStr;

      const cell = document.createElement("div");
      cell.className = "day-cell" + (isOutside ? " outside" : "") + (isToday ? " is-today" : "");

      const numRow = document.createElement("div");
      numRow.className = "day-num-row";
      numRow.innerHTML = `<span class="day-num">${cellDate.getDate()}</span>`;
      const addBtn = document.createElement("button");
      addBtn.className = "day-add";
      addBtn.type = "button";
      addBtn.textContent = "+";
      addBtn.setAttribute("aria-label", `${dateStr} 회차 추가`);
      addBtn.addEventListener("click", () => {
        const idx = addRow(dateStr);
        focusRowInTable(activeSubject().id, idx, true);
      });
      numRow.appendChild(addBtn);
      cell.appendChild(numRow);

      const entries = byDate[dateStr];
      if (entries && entries.length) {
        const list = document.createElement("div");
        list.className = "chip-list";
        entries.forEach(({ row, idx }) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip" + (row.done ? " is-done" : "");
          const title = row.unit || row.content || "(제목 없음)";
          chip.textContent = row.classGroup ? `${row.classGroup} · ${title}` : title;
          chip.title = chip.textContent;
          chip.addEventListener("click", () => focusRowInTable(activeSubject().id, idx, false));
          list.appendChild(chip);
        });
        cell.appendChild(list);
      }

      el.calendarGrid.appendChild(cell);
    }

    const unscheduled = rows.filter(r => !r.date).length;
    if (unscheduled > 0) {
      el.unscheduledNote.hidden = false;
      el.unscheduledNote.innerHTML = `날짜가 지정되지 않은 회차 ${unscheduled}건이 있습니다.`;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "표에서 보기";
      btn.addEventListener("click", () => switchView("table"));
      el.unscheduledNote.appendChild(btn);
    } else {
      el.unscheduledNote.hidden = true;
    }
  }

  function normalizeCell(raw) {
    if (raw && typeof raw === "object") return { subjectId: raw.subjectId || "", classGroup: raw.classGroup || "" };
    return { subjectId: raw || "", classGroup: "" };
  }

  function renderTimetable() {
    const tt = state.timetable;

    el.timetableHead.innerHTML = '<th class="col-num">교시</th>' +
      tt.days.map(d => `<th>${d}</th>`).join("") +
      '<th class="col-del"></th>';

    el.timetableBody.innerHTML = "";
    tt.periods.forEach((period, pIdx) => {
      const tr = document.createElement("tr");

      const labelTd = document.createElement("td");
      labelTd.className = "col-num";
      const labelInput = document.createElement("input");
      labelInput.type = "text";
      labelInput.value = period.label;
      labelInput.className = "tt-period-label";
      labelInput.setAttribute("aria-label", `${pIdx + 1}번째 교시 이름`);
      labelInput.addEventListener("input", () => { period.label = labelInput.value; scheduleSave(); });
      labelTd.appendChild(labelInput);
      tr.appendChild(labelTd);

      tt.days.forEach(day => {
        const td = document.createElement("td");
        td.className = "tt-cell";

        const cellData = normalizeCell(period.cells[day]);
        period.cells[day] = cellData;

        const inner = document.createElement("div");
        inner.className = "tt-cell-inner";

        const topRow = document.createElement("div");
        topRow.className = "tt-cell-top";

        const select = document.createElement("select");
        select.className = "tt-select";
        select.setAttribute("aria-label", `${period.label} ${day}요일 과목`);
        const noneOpt = document.createElement("option");
        noneOpt.value = "";
        noneOpt.textContent = "−";
        select.appendChild(noneOpt);
        state.subjects.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.id;
          opt.textContent = s.name || "(제목 없음)";
          if (cellData.subjectId === s.id) opt.selected = true;
          select.appendChild(opt);
        });
        topRow.appendChild(select);

        const classInput = document.createElement("input");
        classInput.type = "text";
        classInput.className = "tt-class-input";
        classInput.placeholder = "반";
        classInput.value = cellData.classGroup;
        classInput.setAttribute("aria-label", `${period.label} ${day}요일 반`);
        classInput.addEventListener("input", () => {
          cellData.classGroup = classInput.value;
          scheduleSave();
        });

        function syncFilled() {
          const matchedSubject = state.subjects.find(s => s.id === select.value);
          const filled = !!select.value && !!matchedSubject;
          td.classList.toggle("is-filled", filled);
          if (filled) {
            td.style.setProperty("--cell-color", subjectColorVar(matchedSubject));
          } else {
            td.style.removeProperty("--cell-color");
          }
          const existingJump = topRow.querySelector(".tt-jump");
          if (existingJump) existingJump.remove();
          if (filled) {
            const jump = document.createElement("button");
            jump.type = "button";
            jump.className = "tt-jump";
            jump.textContent = "→";
            jump.title = "오늘 날짜로 진도를 추가하며 이 과목 진도표로 이동";
            jump.addEventListener("click", () => {
              state.activeId = select.value;
              const todayStr = toDateStr(today.getFullYear(), today.getMonth(), today.getDate());
              const idx = addRow(todayStr);
              if (cellData.classGroup) activeSubject().rows[idx].classGroup = cellData.classGroup;
              renderAll();
              focusRowInTable(select.value, idx, true);
              scheduleSave();
            });
            topRow.appendChild(jump);
          }
        }

        select.addEventListener("change", () => {
          cellData.subjectId = select.value;
          syncFilled();
          scheduleSave();
        });

        syncFilled();
        inner.appendChild(topRow);
        inner.appendChild(classInput);
        td.appendChild(inner);
        tr.appendChild(td);
      });

      const delTd = document.createElement("td");
      delTd.className = "col-del";
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "row-del";
      delBtn.title = "이 교시 삭제";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", () => {
        tt.periods.splice(pIdx, 1);
        renderTimetable();
        scheduleSave();
      });
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);

      el.timetableBody.appendChild(tr);
    });
  }

  function renderAll() {
    renderTabs();
    fillHeaderInputs();
    renderRows();
    renderStats();
    if (currentView === "calendar") renderCalendar();
    if (currentView === "timetable") renderTimetable();
  }

  /* ---- Excel / CSV import ---- */

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field); field = "";
      } else if (c === "\n") {
        row.push(field); rows.push(row); row = []; field = "";
      } else if (c === "\r") {
        /* skip */
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  async function inflateRaw(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function readZipEntries(buffer, wantPredicate) {
    const bytes = new Uint8Array(buffer);
    const view = new DataView(buffer);
    const decoder = new TextDecoder("utf-8");
    const result = {};
    let offset = 0;
    while (offset + 30 <= bytes.length) {
      const sig = view.getUint32(offset, true);
      if (sig !== 0x04034b50) break;
      const method = view.getUint16(offset + 8, true);
      const compSize = view.getUint32(offset + 18, true);
      const fnLen = view.getUint16(offset + 26, true);
      const efLen = view.getUint16(offset + 28, true);
      const nameStart = offset + 30;
      const fileName = decoder.decode(bytes.subarray(nameStart, nameStart + fnLen));
      const dataStart = nameStart + fnLen + efLen;
      const dataEnd = dataStart + compSize;
      if (wantPredicate(fileName)) {
        const raw = bytes.slice(dataStart, dataEnd);
        if (method === 0) {
          result[fileName] = decoder.decode(raw);
        } else if (method === 8) {
          result[fileName] = decoder.decode(await inflateRaw(raw));
        }
      }
      offset = dataEnd;
    }
    return result;
  }

  function parseSharedStrings(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    return Array.from(doc.getElementsByTagName("si")).map(si =>
      Array.from(si.getElementsByTagName("t")).map(t => t.textContent).join("")
    );
  }

  function colLettersToIndex(letters) {
    let n = 0;
    for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
    return n - 1;
  }

  function parseSheetXml(xmlText, sharedStrings) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    const rowEls = Array.from(doc.getElementsByTagName("row"));
    const grid = [];
    let maxCol = 0;
    rowEls.forEach(rowEl => {
      const rIdx = rowEl.hasAttribute("r") ? parseInt(rowEl.getAttribute("r"), 10) - 1 : grid.length;
      if (!grid[rIdx]) grid[rIdx] = [];
      Array.from(rowEl.getElementsByTagName("c")).forEach(c => {
        const ref = c.getAttribute("r") || "";
        const m = ref.match(/^([A-Z]+)/);
        const colIdx = m ? colLettersToIndex(m[1]) : grid[rIdx].length;
        const type = c.getAttribute("t");
        let text = "";
        if (type === "inlineStr") {
          const isEl = c.getElementsByTagName("is")[0];
          text = isEl ? Array.from(isEl.getElementsByTagName("t")).map(t => t.textContent).join("") : "";
        } else {
          const vEl = c.getElementsByTagName("v")[0];
          const raw = vEl ? vEl.textContent : "";
          text = type === "s" ? (sharedStrings[parseInt(raw, 10)] || "") : raw;
        }
        grid[rIdx][colIdx] = text;
        if (colIdx > maxCol) maxCol = colIdx;
      });
    });
    return grid.map(row => {
      const dense = [];
      for (let c = 0; c <= maxCol; c++) dense[c] = (row && row[c]) || "";
      return dense;
    });
  }

  async function parseXlsx(buffer) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("unsupported-browser");
    }
    const entries = await readZipEntries(
      buffer,
      name => /^xl\/worksheets\/sheet\d+\.xml$/.test(name) || name === "xl/sharedStrings.xml"
    );
    const sheetNames = Object.keys(entries)
      .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
      .sort((a, b) => parseInt(a.match(/sheet(\d+)\.xml/)[1], 10) - parseInt(b.match(/sheet(\d+)\.xml/)[1], 10));
    if (!sheetNames.length) throw new Error("no-worksheet");
    const sharedStrings = entries["xl/sharedStrings.xml"] ? parseSharedStrings(entries["xl/sharedStrings.xml"]) : [];
    return parseSheetXml(entries[sheetNames[0]], sharedStrings);
  }

  async function parseTimetableFile(file) {
    const name = file.name.toLowerCase();
    if (name.endsWith(".csv")) return parseCSV(await file.text());
    if (name.endsWith(".xlsx")) return parseXlsx(await file.arrayBuffer());
    throw new Error("unsupported-type");
  }

  function detectTimetable(grid) {
    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
    let headerRowIdx = -1, dayCols = [], best = 0;
    for (let r = 0; r < Math.min(grid.length, 8); r++) {
      const cols = [];
      (grid[r] || []).forEach((cell, c) => {
        const t = (cell || "").trim();
        const day = dayNames.find(d => t.startsWith(d));
        if (day && !cols.some(x => x.day === day)) cols.push({ day, c });
      });
      if (cols.length > best) { best = cols.length; headerRowIdx = r; dayCols = cols; }
    }
    if (headerRowIdx === -1 || best < 2) return null;
    dayCols.sort((a, b) => a.c - b.c);

    const slots = [];
    for (let r = headerRowIdx + 1; r < grid.length; r++) {
      const label = ((grid[r] || [])[0] || "").trim();
      const values = {};
      let any = false;
      dayCols.forEach(({ day, c }) => {
        const v = ((grid[r] || [])[c] || "").trim();
        values[day] = v;
        if (v) any = true;
      });
      if (!label && !any) continue;
      const periodLabel = label ? (/^\d+$/.test(label) ? `${label}교시` : label) : `${slots.length + 1}교시`;
      slots.push({ label: periodLabel, values });
    }
    if (!slots.length) return null;
    return { days: dayCols.map(x => x.day), slots };
  }

  function applyDetectedTimetable(detected, createMissing) {
    const existingByName = new Map(state.subjects.map(s => [s.name.trim(), s]));
    const periods = detected.slots.map(slot => {
      const cells = {};
      detected.days.forEach(day => {
        const text = (slot.values[day] || "").trim();
        if (!text) { cells[day] = { subjectId: "", classGroup: "" }; return; }
        let subject = existingByName.get(text);
        if (!subject && createMissing) {
          subject = makeSubject(text);
          subject.colorIndex = nextColor();
          state.subjects.push(subject);
          existingByName.set(text, subject);
        }
        cells[day] = { subjectId: subject ? subject.id : "", classGroup: "" };
      });
      return { label: slot.label, cells };
    });
    const order = ["일", "월", "화", "수", "목", "금", "토"];
    state.timetable = { days: order.filter(d => detected.days.includes(d)), periods };
  }

  [
    [el.subject, "name"],
    [el.teacher, "teacher"],
    [el.semester, "semester"],
    [el.book, "book"],
  ].forEach(([input, key]) => {
    input.addEventListener("input", () => {
      activeSubject()[key] = input.value;
      if (key === "name") renderTabs();
      scheduleSave();
    });
  });

  el.addRowBtn.addEventListener("click", () => {
    const subject = activeSubject();
    const idx = addRow();
    if (currentView === "table") {
      focusRowInTable(subject.id, idx, true);
    } else {
      renderCalendar();
    }
  });
  el.combinedToggleBtn.addEventListener("click", () => {
    combinedView = !combinedView;
    updateCombinedToggle();
    renderRows();
    renderStats();
  });
  document.getElementById("printBtn").addEventListener("click", () => window.print());

  el.viewTableBtn.addEventListener("click", () => switchView("table"));
  el.viewCalendarBtn.addEventListener("click", () => switchView("calendar"));
  el.viewTimetableBtn.addEventListener("click", () => switchView("timetable"));
  el.prevMonthBtn.addEventListener("click", () => {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
    renderCalendar();
  });
  el.nextMonthBtn.addEventListener("click", () => {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
    renderCalendar();
  });
  el.todayBtn.addEventListener("click", () => {
    currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    renderCalendar();
  });
  el.addPeriodBtn.addEventListener("click", () => {
    state.timetable.periods.push({ label: `${state.timetable.periods.length + 1}교시`, cells: {} });
    renderTimetable();
    scheduleSave();
  });
  el.importExcelBtn.addEventListener("click", () => el.excelFileInput.click());
  el.excelFileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;

    let grid;
    try {
      grid = await parseTimetableFile(file);
    } catch (err) {
      if (err && err.message === "unsupported-browser") {
        alert("이 브라우저에서는 엑셀 파일 자동 불러오기를 지원하지 않아요. 최신 Chrome, Edge, Safari를 사용해보시거나 CSV 파일로 저장해서 다시 시도해주세요.");
      } else {
        alert("파일을 읽는 중 문제가 발생했습니다. xlsx 또는 csv 파일인지 확인하고 다시 시도해주세요.");
      }
      return;
    }

    const detected = detectTimetable(grid);
    if (!detected) {
      alert("시간표 형식을 인식하지 못했어요. 첫 행에 요일(월~금), 첫 열에 교시가 있는 표 형식인지 확인해주세요.");
      return;
    }

    const hasExisting = state.timetable.periods.some(p => Object.values(p.cells).some(c => normalizeCell(c).subjectId));
    if (hasExisting && !confirm("기존 시간표 내용을 새로 불러온 내용으로 덮어씁니다. 계속할까요?")) return;

    const existingNames = new Set(state.subjects.map(s => s.name.trim()));
    const newNames = Array.from(new Set(
      detected.slots.flatMap(s => Object.values(s.values)).map(v => v.trim()).filter(v => v && !existingNames.has(v))
    ));
    let createMissing = true;
    if (newNames.length) {
      createMissing = confirm(`다음 이름이 새 과목 탭으로 추가됩니다:\n${newNames.join(", ")}\n\n확인을 누르면 새 탭이 추가되고, 취소를 누르면 목록에 없는 과목명은 빈 칸으로 남습니다.`);
    }

    applyDetectedTimetable(detected, createMissing);
    switchView("timetable");
    renderAll();
    scheduleSave();
    alert(`시간표를 불러왔습니다. (${detected.days.length}개 요일 × ${detected.slots.length}개 교시)`);
  });

  el.resetTimetableBtn.addEventListener("click", () => {
    if (confirm("시간표를 초기화할까요? 요일·교시 구성과 배정된 과목이 모두 지워집니다. 이 작업은 되돌릴 수 없습니다.")) {
      state.timetable = defaultTimetable();
      renderTimetable();
      scheduleSave();
    }
  });

  el.resetBtn.addEventListener("click", () => {
    const subject = activeSubject();
    if (confirm(`"${subject.name || "이 과목"}"의 진도표 내용을 초기화할까요? 이 작업은 되돌릴 수 없습니다.`)) {
      subject.rows = [makeRow(), makeRow(), makeRow()];
      renderRows();
      renderStats();
      if (currentView === "calendar") renderCalendar();
      scheduleSave();
    }
  });

  renderAll();
</script>
